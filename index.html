<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Günün Maçları</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    .mac-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .mac-kart {
      background: #ffffff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      border: 1px solid #e1e4e8;
    }

    .mac-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #6c757d;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .takimlar {
      font-size: 1rem;
      font-weight: bold;
      color: #212529;
      text-align: center;
      margin: 12px 0;
    }

    .skor {
      background-color: #e9ecef;
      text-align: center;
      padding: 6px;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #495057;
    }
  </style>
</head>
<body>

  <h2>Günün Maç Bülteni</h2>
  <div id="mac-listesi" class="mac-container">Yükleniyor...</div>

  <script>
    const jsonUrl = 'https://raw.githubusercontent.com/teador612/sistem/main/maclar.json';

    async function maclariGetir() {
      try {
        const response = await fetch(jsonUrl);
        const maclar = await response.json();

        const container = document.getElementById('mac-listesi');
        container.innerHTML = '';

        maclar.forEach(mac => {
          const kart = document.createElement('div');
          kart.className = 'mac-kart';

          kart.innerHTML = `
            <div class="mac-header">
              <span><b>Saat:</b> ${mac['Saat'] || '-'}</span>
              <span><b>Lig:</b> ${mac['Sütun1'] || mac['Lig'] || '-'}</span>
            </div>
            <div class="takimlar">
              ${mac['Ev Sahibi']} vs ${mac['Misafir']}
            </div>
            <div class="skor">
              İY: <b>${mac['IY'] || '-'}</b> | MS: <b>${mac['MS'] || '-'}</b>
            </div>
          `;

          container.appendChild(kart);
        });
      } catch (error) {
        console.error('Veri yükleme hatası:', error);
        document.getElementById('mac-listesi').innerHTML = '<p>Maç verileri yüklenirken bir sorun oluştu.</p>';
      }
    }

    maclariGetir();
  </script>

</body>
</html>
