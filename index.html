<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Günün Maçları</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    .mac-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .mac-kart {
      background: #ffffff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      border: 1px solid #e1e4e8;
    }

    .mac-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #6c757d;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .takimlar {
      font-size: 1rem;
      font-weight: bold;
      color: #212529;
      text-align: center;
      margin: 12px 0;
    }

    .skor {
      background-color: #e9ecef;
      text-align: center;
      padding: 6px;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #495057;
    }
  </style>
</head>
<body>

  <h2>Günün Maç Bülteni</h2>
  <div id="mac-listesi" class="mac-container">Yükleniyor...</div>

  <script>
    const jsonUrl = 'https://raw.githubusercontent.com/teador612/sistem/main/maclar.json';

    async function maclariGetir() {
      try {
        const response = await fetch(jsonUrl);
        if (!response.ok) {
          throw new Error(`HTTP Hatasi: ${response.status}`);
        }
        
        const data = await response.json();
        const container = document.getElementById('mac-listesi');
        container.innerHTML = '';

        // Yapı kontrolü: Doğrudan liste mi yoksa 'matches' / 'maclar' objesi içinde mi?
        let maclar = [];
        if (Array.isArray(data)) {
          maclar = data;
        } else if (Array.isArray(data.matches)) {
          maclar = data.matches;
        } else if (Array.isArray(data.maclar)) {
          maclar = data.maclar;
        }

        if (maclar.length === 0) {
          container.innerHTML = '<p>Listelenecek maç verisi bulunamadı.</p>';
          return;
        }

        maclar.forEach(mac => {
          const kart = document.createElement('div');
          kart.className = 'mac-kart';

          // Türkçe ve İngilizce anahtar kelimelere esnek erişim
          const saat = mac['Saat'] || mac['time'] || '-';
          const lig = mac['Sütun1'] || mac['Lig'] || mac['league'] || '-';
          const evSahibi = mac['Ev Sahibi'] || mac['home'] || mac['home_team'] || 'Ev Sahibi';
          const misafir = mac['Misafir'] || mac['away'] || mac['away_team'] || 'Misafir';
          const iy = mac['IY'] || mac['ht_score'] || '-';
          const ms = mac['MS'] || mac['ft_score'] || '-';

          kart.innerHTML = `
            <div class="mac-header">
              <span><b>Saat:</b> ${saat}</span>
              <span><b>Lig:</b> ${lig}</span>
            </div>
            <div class="takimlar">
              ${evSahibi} vs ${misafir}
            </div>
            <div class="skor">
              İY: <b>${iy}</b> | MS: <b>${ms}</b>
            </div>
          `;

          container.appendChild(kart);
        });

      } catch (error) {
        console.error('Hata detayı:', error);
        document.getElementById('mac-listesi').innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; color: red;">
            <p><b>Veri yüklenirken hata oluştu!</b></p>
            <p><small>${error.message}</small></p>
          </div>`;
      }
    }

    maclariGetir();
  </script>

</body>
</html>
